<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order Notifier v2 — Slideshow + Pop-up</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: #000;
            color: #fff;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
            overflow: hidden;
        }
        /* ===== Slideshow ===== */
        #slideshow {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            background: #000;
        }

        #slideImage {
            max-width: 100vw;
            max-height: 100vh;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 600ms ease;
            opacity: 1;
            background: #000;
        }

        #slideFrame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: #000;
        }

        .fade-out {
            opacity: 0;
        }

        /* ===== Order Overlay ===== */
        #orderOverlay {
            position: fixed;
            inset: 0;
            display: grid;
            grid-template-rows: 1fr auto;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(3px);
            z-index: 50;
        }

            #orderOverlay[hidden] {
                display: none;
            }

        .order-card {
            align-self: center;
            justify-self: center;
            width: min(1200px, 92vw);
            background: #0b0b0e;
            border: 2px solid #4ade80;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 0 8px rgba(74,222,128,0.15) inset;
            padding: clamp(20px, 5vw, 40px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            font-weight: 700;
            letter-spacing: .02em;
            text-transform: uppercase;
            font-size: clamp(18px,2vw,24px);
        }

            .brand .dot {
                width: 10px;
                height: 10px;
                border-radius: 999px;
                background: #4ade80;
                box-shadow: 0 0 24px #4ade80;
            }

        .headline {
            font-size: clamp(34px, 6vw, 72px);
            line-height: 1.05;
            margin: 10px 0 6px;
            font-weight: 800;
            text-shadow: 0 2px 14px rgba(0,0,0,.5);
        }

        .subhead {
            font-size: clamp(18px,3vw,28px);
            opacity: .85;
            margin-bottom: 18px;
        }

        .meta {
            display: grid;
            grid-template-columns: repeat(2, minmax(0,1fr));
            gap: 14px;
        }

            .meta.three {
                grid-template-columns: repeat(3, minmax(0,1fr));
                margin-top: 14px;
            }

            .meta div {
                background: #0f172a;
                border: 1px solid #334155;
                border-radius: 12px;
                padding: 12px 14px;
            }

        .k {
            opacity: .65;
            font-size: clamp(12px,1.6vw,14px);
            text-transform: uppercase;
            letter-spacing: .1em;
        }

        .v {
            font-size: clamp(16px, 2.8vw, 24px);
            font-weight: 600;
        }

        .footer-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 0 0;
            font-size: clamp(14px,2vw,18px);
            opacity: .9;
        }

        .badge {
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid #334155;
            background: #0f172a;
        }

        .btn-close {
            cursor: pointer;
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid #4ade80;
            background: #052b16;
            color: #d1fae5;
            font-weight: 700;
        }

        /* ===== Confetti ===== */
        .confetti {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

            .confetti i {
                position: absolute;
                width: 10px;
                height: 14px;
                opacity: 0;
                transform: translateY(-20px) rotate(0deg);
                animation: fall 1800ms linear forwards;
            }

        @keyframes fall {
            0% {
                opacity: 0;
                transform: translateY(-20px) rotate(0deg);
            }

            10% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: translateY(110vh) rotate(720deg);
            }
        }

        /* ===== Debug button ===== */
        #debugBar {
            position: fixed;
            bottom: 12px;
            left: 12px;
            display: flex;
            gap: 8px;
            z-index: 60;
        }

            #debugBar button {
                padding: 8px 12px;
                border-radius: 8px;
                border: 1px solid #334155;
                background: #0f172a;
                color: #cbd5e1;
                cursor: pointer;
            }

            #debugBar[hidden] {
                display: none;
            }
    </style>
</head>
<body>

    <!-- Fullscreen slideshow -->
    <div id="slideshow">
        <img id="slideImage" alt="" src="" />
        <iframe id="slideFrame" title="Slide Frame" frameborder="0" referrerpolicy="no-referrer-when-downgrade" hidden></iframe>
    </div>

    <!-- Order overlay -->
    <section id="orderOverlay" hidden>
        <div class="order-card">
            <div class="brand"><span class="dot"></span> New Order Alert</div>
            <div class="headline" id="orderHeadline">Congratulations! 🎉</div>
            <div class="subhead" id="orderSubhead">A new customer will enjoy the benefits of a Stiltz lift.</div>

            <div class="meta">
                <div><div class="k">Customer ID</div><div class="v" id="customerId">—</div></div>
                <div><div class="k">Partner</div><div class="v" id="partnerName">—</div></div>
            </div>

            <!-- Team roles -->
            <div class="meta three">
                <div><div class="k">ISR</div><div class="v" id="isrName">—</div></div>
                <div><div class="k">CSR</div><div class="v" id="csrName">—</div></div>
                <div><div class="k">DSM</div><div class="v" id="dsmName">—</div></div>
            </div>

            <div class="footer-bar">
                <div class="badge" id="orderTime">—</div>
                <button class="btn-close" id="closeOrder">Back to slideshow ↩</button>
            </div>
        </div>
        <div class="confetti" id="confetti"></div>
    </section>

    <!-- Debug controls -->
    <div id="debugBar" hidden>
        <button id="btnTestOrder">Test Order</button>
        <button id="btnTogglePause">Pause/Resume</button>
    </div>

    <!-- If your file lives at a different path, change the URL below -->
    <audio id="ding" preload="auto">
        <source src="./sounds/ding.mp3" type="audio/mpeg" />
    </audio>

    <script>
        /* =============================
           CONFIG
           ============================= */
        const CONFIG = {
            slides: [],                                // loaded from slides.json
            slideDurationMs: 50000,
            fadeMs: 600,
            orderDisplayMs: 25000,
            showDebug: false,
            websocket: { enabled: false, url: "" },
            poll: {
                enabled: true,
                url: "./orders.json",
                intervalMs: 7000
            },
            orderIdField: "customerId",
            remote: { slidesUrl: "./slides.json" }
        };

        /* =============================
           Slideshow Logic
           ============================= */
        const slideImage = document.getElementById('slideImage');
        const slideFrame = document.getElementById('slideFrame');
        let slideIdx = 0, slideTimer = null, paused = false;

        function preloadImages(list) { list.filter(s => s.type === 'image').forEach(s => { const i = new Image(); i.src = s.src; }); }
        function setActiveView(kind) { slideImage.hidden = (kind !== 'image'); slideFrame.hidden = (kind === 'image'); }
        function showSlide(i) {
            if (!CONFIG.slides || !CONFIG.slides.length) return;
            const s = CONFIG.slides[i % CONFIG.slides.length];
            if (s.type === 'image') {
                const src = s.src; slideImage.classList.add('fade-out');
                setTimeout(() => {
                    slideImage.onload = () => slideImage.classList.remove('fade-out');
                    slideImage.onerror = () => { console.warn('[slideshow] image failed', src); slideImage.classList.remove('fade-out'); };
                    setActiveView('image'); slideImage.src = src;
                    setTimeout(() => slideImage.classList.remove('fade-out'), CONFIG.fadeMs + 1000);
                }, CONFIG.fadeMs);
            } else if (s.type === 'url') {
                const src = s.src + (s.src.includes('?') ? '&' : '?') + '_t=' + Date.now();
                setActiveView('url'); slideFrame.src = src;
            }
        }
        function startSlideshow() {
            if (!CONFIG.slides || !CONFIG.slides.length) return;
            showSlide(slideIdx); clearInterval(slideTimer);
            slideTimer = setInterval(() => { if (!paused) { slideIdx = (slideIdx + 1) % CONFIG.slides.length; showSlide(slideIdx); } }, CONFIG.slideDurationMs);
        }
        function pauseSlideshow() { paused = true; } function resumeSlideshow() { paused = false; }

        /* =============================
           Order Overlay Logic
           ============================= */
        const overlay = document.getElementById('orderOverlay');
        const closeBtn = document.getElementById('closeOrder');
        const ding = document.getElementById('ding');
        const fields = {
            custId: document.getElementById('customerId'),
            partner: document.getElementById('partnerName'),
            time: document.getElementById('orderTime'),
            isr: document.getElementById('isrName'),
            csr: document.getElementById('csrName'),
            dsm: document.getElementById('dsmName'),
        };
        let audioReady = false;
        let hideTimer = null;
        let lastOrderKey = null;
        let lastETag = null;

        function dget(o, p) { return String(p).split('.').reduce((a, k) => (a && a[k] != null ? a[k] : undefined), o); }
        function pickDeep(o, ps) { for (const p of ps) { const v = dget(o, p); if (v != null && v !== '') return v; } }

        function normalizeOrder(o) {
            if (!o || typeof o !== 'object') return {};
            let id = pickDeep(o, ['customerId', 'customerID', 'fields.customerId']);
            let partner = pickDeep(o, ['partner', 'fields.partner']);
            let name = pickDeep(o, ['customerName', 'fields.customerName']);
            const text = [o.subject, o.body, dget(o, 'fields.text')].filter(Boolean).join('  ');

            const idNameRaw = pickDeep(o, ['idName', 'fields.idName']);
            if (idNameRaw) {
                const mm = String(idNameRaw).match(/\b(C?\d{6,})\s+(.+)/);
                if (mm) { if (!id) id = mm[1]; if (!name) name = mm[2].trim(); }
            }

            if (text && !id) { const m = text.match(/\bC?\d{6,}\b/); if (m) id = m[0]; }
            if (text && !partner) { const m = text.match(/from\s+(.+?)(?:[.!]\s*|$)/i); if (m) partner = m[1].trim(); }
            if (text && id && !name) { const re = new RegExp(id + '\\s+(.+?)\\s+(?:from|by)\\b', 'i'); const m = re.exec(text); if (m) name = m[1].trim(); }

            const ts = o.timestamp || o.receivedAt || new Date().toISOString();

            const clean = v => (v == null ? null : String(v).replace(/^\s*-+\s*/, '').trim() || null);
            const isr = clean(dget(o, 'fields.isr') ?? o.isr);
            const csr = clean(dget(o, 'fields.csr') ?? o.csr);
            const dsm = clean(dget(o, 'fields.dsm') ?? o.dsm);

            const idName = (id && name) ? `${id} ${name}` : (idNameRaw || null);
            return { customerId: id, customerName: name, idName, partner, timestamp: ts, isr, csr, dsm };
        }

        function renderOrder(o) {
            const n = normalizeOrder(o);
            fields.custId.textContent = n.idName || (n.customerName ? `${n.customerId} ${n.customerName}` : n.customerId);
            fields.partner.textContent = n.partner || '—';
            fields.isr.textContent = n.isr || '—';
            fields.csr.textContent = n.csr || '—';
            fields.dsm.textContent = n.dsm || '—';
            const when = n.timestamp ? new Date(n.timestamp) : new Date();
            fields.time.textContent = `Received ${when.toLocaleString()}`;
        }

        function simpleConfetti() {
            const root = document.getElementById('confetti'); root.innerHTML = '';
            const colors = ['#4ade80', '#60a5fa', '#f472b6', '#facc15', '#f97316', '#22d3ee'];
            for (let i = 0; i < 90; i++) {
                const b = document.createElement('i');
                b.style.left = Math.random() * 100 + 'vw';
                b.style.animationDelay = (Math.random() * 0.6) + 's';
                b.style.animationDuration = (1.4 + Math.random() * 1.2) + 's';
                b.style.background = colors[Math.floor(Math.random() * colors.length)];
                root.appendChild(b);
            }
        }

        function showOrder(o) {
            pauseSlideshow();
            renderOrder(o);
            overlay.hidden = false;
            clearTimeout(hideTimer);
            hideTimer = setTimeout(hideOrder, CONFIG.orderDisplayMs);
            simpleConfetti();
            try { if (audioReady) { ding.currentTime = 0; ding.play(); } } catch { }
        }
        function hideOrder() { overlay.hidden = true; resumeSlideshow(); }
        closeBtn.addEventListener('click', hideOrder);

        function isValidOrder(o) { const n = normalizeOrder(o); return !!(n.customerId && n.partner); }

        function handleIncomingOrder(order) {
            const n = normalizeOrder(order);
            if (!n.customerId || !n.partner) { console.log('[order] ignored (missing fields after normalize)', order); return; }
            const subj = (order.subject || '').trim();
            const key = `${String(n.customerId)}|${n.timestamp || ''}|${subj}`;
            if (key && lastOrderKey === key) { console.log('[order] duplicate ignored by key', key); return; }
            lastOrderKey = key;
            showOrder(n);
        }

        function pickLatest(list) {
            if (!Array.isArray(list) || !list.length) return;
            return list.sort((a, b) => Date.parse(b.timestamp || 0) - Date.parse(a.timestamp || 0))[0];
        }

        async function pollOnce() {
            try {
                const url = CONFIG.poll.url + (CONFIG.poll.url.includes('?') ? '&' : '?') + '_t=' + Date.now();
                const res = await fetch(url, { cache: 'no-store' });
                if (!res.ok) { console.warn('[poll] HTTP', res.status); return; }

                const etag = res.headers.get('etag') || res.headers.get('x-ms-file-etag') || res.headers.get('last-modified') || null;

                const ct = res.headers.get('content-type') || '';
                let data;
                if (ct.includes('application/json')) { data = await res.json(); }
                else { const text = await res.text(); try { data = JSON.parse(text); } catch { console.warn('[poll] non-JSON response'); return; } }

                const order = Array.isArray(data) ? data[0]
                    : (Array.isArray(data.orders) ? pickLatest(data.orders) : (data.latest || data));

                if (isValidOrder(order)) {
                    if (etag && etag !== lastETag) { lastETag = etag; lastOrderKey = null; }
                    handleIncomingOrder(order);
                }
            } catch (e) { console.error('[poll] error', e); }
        }
        function startPolling() { pollOnce(); setInterval(pollOnce, CONFIG.poll.intervalMs); }

        /* Debug */
        function setupDebug() {
            if (!CONFIG.showDebug) return;
            const bar = document.getElementById('debugBar'); bar.hidden = false;
            document.getElementById('btnTestOrder').onclick = () => handleIncomingOrder({
                subject: 'Test', timestamp: new Date().toISOString(),
                fields: { idName: 'C123456 Demo Customer', partner: 'Demo Partner', isr: 'Alice', csr: 'Bob', dsm: 'Carol' }
            });
            document.getElementById('btnTogglePause').onclick = () => paused = !paused;
        }

        async function loadSlides() {
            try {
                const res = await fetch(CONFIG.remote.slidesUrl + '?_t=' + Date.now(), { cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                const list = Array.isArray(data) ? data : (Array.isArray(data.slides) ? data.slides : []);
                if (list.length) CONFIG.slides = list;
                if (data.slideDurationMs) CONFIG.slideDurationMs = +data.slideDurationMs || CONFIG.slideDurationMs;
            } catch (e) {
                console.warn('[slides] load failed:', e);
                // Fallback: point to your Pages-hosted images so local file:// still works
                CONFIG.slides = CONFIG.slides.length ? CONFIG.slides : [
                    { type: 'image', src: 'https://order-notifier-data.pages.dev/slides/EASY.png' },
                    { type: 'image', src: 'https://order-notifier-data.pages.dev/slides/NICE.png' },
                    { type: 'image', src: 'https://order-notifier-data.pages.dev/slides/TNT.png' },
                ];
            }
        }

        function setupAudioUnlock() {
            const unlock = () => {
                ding.play().then(() => {
                    ding.pause(); ding.currentTime = 0;
                    audioReady = true;
                    window.removeEventListener('click', unlock);
                    window.removeEventListener('keydown', unlock);
                    console.log('[audio] unlocked');
                }).catch(() => { /* wait for user gesture */ });
            };
            window.addEventListener('click', unlock);
            window.addEventListener('keydown', unlock);
        }

        /* Boot */
        (function init() {
            setupAudioUnlock();
            loadSlides().then(() => {
                preloadImages(CONFIG.slides);
                startSlideshow();
                setupDebug();
                if (CONFIG.websocket.enabled && CONFIG.websocket.url) {
                    // startWebSocket();
                } else if (CONFIG.poll.enabled && CONFIG.poll.url) {
                    startPolling();
                }
            });
        })();
    </script>
</body>
</html>
